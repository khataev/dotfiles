add_newline = false
format = """
$username at $hostname $directory $git_branch $git_status
$character
"""
[username]
format = "[$user]($style)"
[directory]
style = "cyan bold"
truncation_length = 3
truncate_to_repo = true
[git_status]
style = "red"
format = '[$all_status$ahead_behind]($style) '
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
[package]
disabled = true
[nodejs]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[battery]
disabled = true
[time]
disabled = true
